</h2>
<div class="para logical">
<div class="para">For any integer <span class="process-math">\(n\)</span> and nonnegative integer <span class="process-math">\(m\text{,}\)</span> we have</div>
<div class="displaymath process-math">
\begin{equation*}
(n+1)^m = \sum_{k=0}^m \binom{m}{k}n^{m-k}
\end{equation*}
</div>

<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.4.23</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Explicit formula for binomial coefficients.</span>
</h2>
<div class="para logical">
<div class="para">For integers <span class="process-math">\(0 \le k \le n\text{,}\)</span> we have</div>
<div class="displaymath process-math">
\begin{equation*}
\binom{n}{k} = \frac{n!}{k!(n-k)!}
\end{equation*}
</div>

<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">5.3.14</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Broken promise.</span>
</h2>
<div class="para logical">
<div class="para">The negation of “If <span class="process-math">\(P\text{,}\)</span> then <span class="process-math">\(Q\)</span>” is the <dfn class="terminology">broken promise</dfn> “<span class="process-math">\(P\)</span> but not <span class="process-math">\(Q\)</span>”. That is,</div>
<div class="displaymath process-math">
\begin{equation*}
\neg(P \to Q) \equiv P \land \neg Q
\end{equation*}
</div>

<div class="para logical">
<div class="para">We can write <span class="process-math">\(2=2^1\)</span> to get</div>

\begin{equation*}
2\cdot2^{n-1} = 2^12^{n-1}=2^{1+(n-1)}=2^n
\end{equation*}
</div>

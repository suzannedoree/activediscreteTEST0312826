<div class="para">By definition and using that <span class="process-math">\(5!=120\)</span> from <a href="sec_counting_steps_cases.html#defn_factorial" class="xref" data-knowl="./knowl/xref/defn_factorial.html" data-reveal-label="Reveal" data-close-label="Close" title="Definition 2.2.16: Factorial">Definition 2.2.16</a><a href="sec_counting_steps_cases.html#part_5factorial" class="xref" data-knowl="./knowl/xref/part_5factorial.html" data-reveal-label="Reveal" data-close-label="Close" title="Item (a)">(a)</a>, we get</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/xref/defn_factorial.html ./knowl/xref/part_5factorial.html">
\begin{equation*}
6! = (6)\underbrace{(5)(4)(3)(2)(1)}_{5!} = 6(5!)= 6(120) = 720
\end{equation*}

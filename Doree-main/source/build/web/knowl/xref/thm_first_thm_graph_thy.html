<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">1.2.4</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The first theorem of graph theory.</span>
</h2>
<div class="para">The sum of the degrees of the vertices of a graph, counting multiplicities, is twice the number of edges. Equivalently, the number of edges of a graph is half of the sum of the degrees of the vertices.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#thm_first_thm_graph_thy-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

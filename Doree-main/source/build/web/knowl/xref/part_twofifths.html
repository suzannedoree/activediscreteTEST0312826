<div class="para">Write <span class="process-math">\(\frac{2}{5}\)</span> as a fraction with denominator 15. 
<details class="solution solution-like born-hidden-knowl"><summary class="knowl__link"><span class="type">Solution</span><span class="period heading-divison-mark heading-divison-mark__period">.</span></summary>
<div class="solution solution-like knowl__content">
<div class="para logical">
<div class="para">Since <span class="process-math">\(15=3 \times 5\text{,}\)</span> we can use <a href="sec_even_odd_divides.html#thm_equal_fractions" class="xref" data-knowl="./knowl/xref/thm_equal_fractions.html" data-reveal-label="Reveal" data-close-label="Close" title="Theorem 4.1.11: Equal fractions">Theorem 4.1.11</a> to multiply top and bottom of the fraction by three to get</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/xref/thm_equal_fractions.html">
\begin{equation*}
\frac{2}{5} =\frac{3(2)}{3(5)} =\frac{6}{15}
\end{equation*}
</div>

<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.3.12</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Symmetry of the binomial coefficients.</span>

<div class="para logical">
<div class="para">For any positive integers <span class="process-math">\(n\)</span> and <span class="process-math">\(k\)</span> we have</div>
<div class="displaymath process-math">

\binom{n}{k}=\binom{n}{n-k}
\end{equation*}
</div>

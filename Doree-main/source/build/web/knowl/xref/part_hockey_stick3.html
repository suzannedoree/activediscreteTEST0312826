<div class="para">Use the arithmetic triangle to evaluate <span class="process-math">\(\displaystyle \sum_{k=3}^7 \binom{k}{3}\text{.}\)</span> 
<details class="solution solution-like born-hidden-knowl"><summary class="knowl__link"><span class="type">Solution</span><span class="period heading-divison-mark heading-divison-mark__period">.</span></summary>
<div class="solution solution-like knowl__content">
<div class="displaymath process-math">
\begin{equation*}
\sum_{k=3}^7 \binom{k}{3} = \binom{3}{3} + \binom{4}{3} + \binom{5}{3} + \binom{6}{3} + \binom{7}{3} = 1 + 4 + 10 + 20 + 35 = 70
\end{equation*}
</div>

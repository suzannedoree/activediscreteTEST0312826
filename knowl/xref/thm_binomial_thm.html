<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.4.20</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">The binomial theorem.</span>
</h2>
<div class="para logical">
<div class="para">For any real numbers <span class="process-math">\(x\)</span> and <span class="process-math">\(y\)</span> and any nonnegative integer <span class="process-math">\(m\text{,}\)</span> we have</div>
<div class="displaymath process-math">
\begin{equation*}
(x+y)^m = \sum_{k=0}^m\binom{m}{k}x^{m-k}y^k
\end{equation*}
</div>
